{% set name = "lume-base" %}
{% set version = "0.6.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/lume-science/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: a9b7748da2aa846f63eda991ae27001ad7cfaa1bb41ccf7cca6eaec54959d055

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - h5py
    - numpy
    - openpmd-beamphysics
    - pydantic
    - pyyaml

test:
  requires:
    - python {{ python_min }}
    - pytest
  imports:
    - lume
    - lume.base
    - lume.parsers
    - lume.serializers
    - lume.tests
    - lume.variables
  commands:
    - pytest -v --pyargs lume.tests

about:
  home: https://github.com/lume-science/lume-base
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Base classes and architecture for LUME Python projects
  description: |
    Base classes and architecture for LUME Python projects
  doc_url: https://lume-science.github.io/lume-base
  dev_url: https://github.com/lume-science/lume-base

extra:
  recipe-maintainers:
    - ChristopherMayes
    - ken-lauer
    - tangkong
